# Release builds (APP_VARIANT=production -> com.mango182.dietscan, "DietScan").
# Runs on every push to master, or manually from the Actions tab.

name: Release builds

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [all, android, ios]
        default: all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      variant: production
      platforms: ${{ inputs.platforms || 'all' }}
