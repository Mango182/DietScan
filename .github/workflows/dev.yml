# Dev builds (APP_VARIANT=development -> com.mango182.dietscan.dev, "DietScan Dev").
# Runs on every push to develop, or manually from the Actions tab on ANY branch
# (e.g. a Feature/* branch after adding a native dependency).

name: Dev builds

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [all, android, ios]
        default: all

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      variant: development
      platforms: ${{ inputs.platforms || 'all' }}
